<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Создать объявление — Рядом</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-container create-page" tabindex="-1">
    <div class="page-heading create-heading">
      <div>
        <p class="eyebrow">Разместить объявление</p>
        <h1>Что продаёте?</h1>
        <p class="page-subtitle">Пара минут — и вещь увидят покупатели поблизости.</p>
      </div>
    </div>

    <form class="create-form" id="create-form" novalidate>
      <div class="form-grid">
        <div class="form-field form-field--full">
          <label for="listing-title">Название <span aria-hidden="true">*</span></label>
          <input id="listing-title" name="title" type="text" maxlength="100" placeholder="Например, кресло IKEA POÄNG" autocomplete="off" required>
          <small class="form-hint">Коротко и по делу — так ваше объявление быстрее найдут.</small>
          <span class="form-error" data-error-for="title" aria-live="polite"></span>
        </div>

        <div class="form-field form-field--full">
          <label for="listing-category-search">Категория <span aria-hidden="true">*</span></label>
          <input id="listing-category-search" type="search" placeholder="Поиск категории, например оперативка" autocomplete="off" aria-controls="category-search-results">
          <div id="category-search-results" class="category-search-results" hidden></div>
          <nav id="category-breadcrumbs" class="category-picker__breadcrumbs" aria-label="Путь категории"></nav>
          <div class="category-picker__toolbar"><span id="category-current-title">Выберите категорию</span><button id="category-back" type="button" hidden>Назад</button></div>
          <div id="category-options" class="category-picker__options"></div>
          <input id="listing-category" name="categoryId" type="hidden" required>
          <span class="form-error" data-error-for="category" aria-live="polite"></span>
        </div>

        <div id="category-attributes" class="form-field form-field--full category-attributes" hidden></div>

        <div class="form-field form-field--full">
          <label for="listing-photos">Фотографии <span aria-hidden="true">*</span></label>
          <div class="photo-upload" id="photo-upload">
            <input id="listing-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
            <button class="photo-upload__dropzone" id="photo-dropzone" type="button" aria-describedby="photo-help">
              <span class="photo-upload__icon" aria-hidden="true">＋</span>
              <strong>Добавить фотографии</strong>
              <small id="photo-help">До 6 фото · JPG, PNG или WebP · первое фото станет обложкой</small>
            </button>
            <div class="photo-upload__previews photo-preview" id="photo-previews" aria-live="polite"></div>
          </div>
          <span class="form-error" data-error-for="photos" aria-live="polite"></span>
        </div>

        <div class="form-field form-field--full">
          <label for="listing-description">Описание <span aria-hidden="true">*</span></label>
          <textarea id="listing-description" name="description" rows="5" maxlength="2000" placeholder="Расскажите о состоянии, комплекте и причинах продажи" required></textarea>
          <span class="form-error" data-error-for="description" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label for="listing-condition">Состояние <span aria-hidden="true">*</span></label>
          <select id="listing-condition" name="condition" required><option value="">Выберите состояние</option></select>
          <span class="form-error" data-error-for="condition" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label for="listing-price">Цена <span aria-hidden="true">*</span></label>
          <div class="price-input"><input id="listing-price" name="price" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required><span aria-hidden="true">₽</span></div>
          <span class="form-error" data-error-for="price" aria-live="polite"></span>
        </div>

        <div class="form-field form-field--full listing-location-field">
          <h2>Где находится товар?</h2>
          <label for="listing-city">Город <span aria-hidden="true">*</span></label>
          <select id="listing-city" name="cityId" required></select>
          <span class="form-error" data-error-for="cityId" aria-live="polite"></span>
        </div>
      </div>

      <div class="create-form__footer">
        <p>Публикация бесплатная. Покупатели в выбранном городе увидят объявление сразу.</p>
        <button class="button button--primary" id="publish-button" type="submit">Опубликовать объявление</button>
      </div>
    </form>
  </main>
  <div id="mobile-nav"></div>
  <div id="toast-root" class="toast-container" role="status" aria-live="polite"></div>
  <script defer src="js/app.bundle.js"></script>
</body>
</html>
