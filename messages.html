<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Сообщения — Рядом</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-container messages-page" id="messages-content" tabindex="-1">
    <div class="page-heading">
      <div>
        <p class="eyebrow">На связи</p>
        <h1>Сообщения</h1>

    </div>
    <div class="messages-layout" id="messages-layout">
      <aside class="conversation-list" aria-label="Диалоги" id="conversation-list"></aside>
      <section class="chat-panel" aria-label="Переписка" id="chat-panel"></section>
    </div>
  </main>
  <div id="mobile-nav"></div>
  <div id="toast-root" class="toast-container" role="status" aria-live="polite"></div>
  <script defer src="js/app.bundle.js"></script>

</html>
